<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализатор прибыли от продукта</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Анализатор прибыли от продукта</h1>
    <div class="input-container">
      <textarea id="product-profits" placeholder="Введите данные о продажах продуктов (продукт, прибыль с продажи)"></textarea>
      <button onclick="analyzeProductProfits()">Проанализировать прибыль</button>
    </div>
    <div id="results-container">
      <h2>Продукт с наибольшей общей прибылью</h2>
      <p id="highest-profit-product"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
