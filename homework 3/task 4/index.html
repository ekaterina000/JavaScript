<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оценки студентов</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Оценки студентов</h1>
    <div class="input-container">
      <input type="text" id="student-names" placeholder="Введите имена студентов (разделенные запятыми)">
      <input type="text" id="student-grades" placeholder="Введите оценки студентов (разделенные пробелами)">
      <button onclick="calculateAverages()">Рассчитать средние оценки</button>
    </div>
    <div id="results-container">
      <table>
        <thead>
          <tr>
            <th>Студент</th>
            <th>Средняя оценка</th>
          </tr>
        </thead>
        <tbody id="results-table-body">
        </tbody>
      </table>
      <p id="lowest-average-student"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
