<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Зоомагазин</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <style>
        body {
            background-image: url('images/store_background.jpg');
            background-size: cover;
            background-attachment: fixed;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="card-body">
        <h1 class='card-title text-center'>Магазин Зоотоваров</h1>

        <div class="form-group mb-3">
            <label for="searchInput">Поиск товаров:</label>
            <input type="text" class="form-control" v-model="searchQuery" placeholder="Введите название, описание или цену">
        </div>

        <div class="form-group mb-3">
            <label for="sortOptions">Сортировать по:</label>
            <select class="form-select" v-model="selectedSort" @change="sortProducts">
                <option value="">Выберите</option>
                <option value="priceAsc">Цена: дешевле</option>
                <option value="priceDesc">Цена: дороже</option>
                <option value="title">Название</option>
            </select>
        </div>

        <ul class="d-flex flex-row justify-content-around flex-wrap bg-light" id="product_list">
            <li v-for="product in filteredProducts" :key="product.title" style="width: 300px" class="d-flex flex-column m-1 p-1 border bg-body">
                <img :src="product.img" :alt="product.title" style="width: 180px" class="align-self-center">
                <h5 class="card-title">{{ product.title }}</h5>
                <p class="card-text">{{ product.description }}</p>
                <p class="card-text">Цена: {{ product.price }} р.</p>
            </li>
        </ul>
    </div>
</div>

<script>
new Vue({
    el: '#app',
    data: {
        searchQuery: '',
        selectedSort: '',
        products: [],
        filteredProducts: []
    },
    created() {
        fetch("shop_data.json")
            .then(response => response.json())
            .then(data => {
                this.products = data;
                this.filteredProducts = data;
            });
    },
    methods: {
        filterProducts() {
            const query = this.searchQuery.toLowerCase();
            this.filteredProducts = this.products.filter(product => {
                return (
                    product.title.toLowerCase().includes(query) ||
                    product.description.toLowerCase().includes(query) ||
                    product.price.toString().includes(query)
                );
            });
        },
        sortProducts() {
            if (this.selectedSort === 'priceAsc') {
                this.filteredProducts.sort((a, b) => a.price - b.price);
            } else if (this.selectedSort === 'priceDesc') {
                this.filteredProducts.sort((a, b) => b.price - a.price);
            } else if (this.selectedSort === 'title') {
                this.filteredProducts.sort((a, b) => a.title.localeCompare(b.title));
            }
        }
    },
    watch: {
        searchQuery () {
            this.filterProducts();
        }
    }
});
</script>
</body>
</html>
